# Manually (or on provider changes) verifies the supermarket connectors against the real sites.
name: live-check
on:
  workflow_dispatch:
    inputs:
      city:
        description: City to check delivery / branches for
        default: רמת גן
  push:
    paths: ['server/providers/**', 'server/cart/**', 'server/catalog.ts', 'server/engine/match.ts', 'scripts/**', '.github/workflows/live-check.yml']
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx tsx scripts/live-check.ts "${{ github.event.inputs.city || 'רמת גן' }}"
      - run: npx tsx scripts/match-report.ts
        continue-on-error: true
      - run: KANITI_BROWSER_HEADLESS=1 npx tsx scripts/address-check.ts tivtaam
        continue-on-error: true
      - run: KANITI_BROWSER_HEADLESS=1 npx tsx scripts/address-check.ts victory
        continue-on-error: true
      - run: KANITI_BROWSER_HEADLESS=1 npx tsx scripts/cart-check.ts tivtaam
        continue-on-error: true
      - run: KANITI_BROWSER_HEADLESS=1 npx tsx scripts/rehearsal.ts "${{ github.event.inputs.city || 'רמת גן' }}"
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-check
          if-no-files-found: ignore
          path: |
            data/*.md
            data/*.json
